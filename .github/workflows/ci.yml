name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package and test tools
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/chirp-sync-smoke
          /tmp/chirp-sync-smoke/bin/python -m pip install dist/*.whl
          /tmp/chirp-sync-smoke/bin/chirp-sync --version
          /tmp/chirp-sync-smoke/bin/chirp-sync --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
